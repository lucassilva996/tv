name: Atualizar canais

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia, 06h de Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: channels
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tools/build_channels.py
      - name: Publicar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A channels.json radios.json state.json logos
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git commit -m "Atualiza lista de canais"
          git push
