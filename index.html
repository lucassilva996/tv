<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TV">
<meta name="theme-color" content="#06070b">
<title>TV</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  :root {
    --bg: #06070b; --panel: rgba(255,255,255,.045); --panel2: rgba(255,255,255,.085); --line: rgba(255,255,255,.09);
    --text: #eef0f5; --muted: #8e94a3; --teal: #2dd4bf; --violet: #8b5cf6; --red: #ef4444;
    --grad: linear-gradient(90deg, #2dd4bf, #8b5cf6);
    --navh: calc(76px + env(safe-area-inset-top));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.35 -apple-system, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  body.lock, body.live-on { overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
  input { font: inherit; color: inherit; }
  .hidden { display: none !important; }
  svg { width: 22px; height: 22px; fill: currentColor; display: block; flex: 0 0 auto; }
  .glow { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0;
          background: radial-gradient(45% 45% at 88% 8%, rgba(139,92,246,.20), rgba(139,92,246,0) 70%),
                      radial-gradient(40% 40% at 6% 96%, rgba(45,212,191,.13), rgba(45,212,191,0) 70%); }

  /* ---------- Navegação ---------- */
  .nav { position: fixed; z-index: 50; top: calc(10px + env(safe-area-inset-top)); left: 12px; right: 12px; height: 56px;
         display: flex; align-items: center; padding: 0 8px 0 14px; border-radius: 28px;
         background: rgba(16,17,24,.82); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--line);
         box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .brand { display: flex; align-items: center; font-weight: 800; font-size: 19px; margin-right: 6px; }
  .brand i { width: 28px; height: 28px; border-radius: 8px; background: url(icon.png) center/cover; margin-right: 8px; }
  .tabs { flex: 1; display: flex; justify-content: center; }
  .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 46px; min-width: 64px; padding: 0 10px; margin: 0 2px; border-radius: 23px; color: var(--muted); font-size: 11px; font-weight: 600; }
  .tab svg { width: 21px; height: 21px; margin-bottom: 2px; }
  .tab.on { color: #fff; background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(45,212,191,.35); }
  .tab.on svg { color: var(--teal); }
  .nav-right { display: flex; align-items: center; }
  #clock { font-weight: 700; font-size: 15px; margin: 0 6px 0 4px; font-variant-numeric: tabular-nums; }
  .iconbtn { width: 42px; height: 42px; border-radius: 21px; display: flex; align-items: center; justify-content: center; }
  .iconbtn:active { background: rgba(255,255,255,.12); }

  .view { position: relative; z-index: 1; }
  .page { padding: calc(var(--navh) + 12px) 0 120px; min-height: 100vh; }
  .page h2 { margin: 6px 20px 14px; font-size: 26px; }
  .empty { padding: 50px 24px; text-align: center; color: var(--muted); }

  /* ---------- Início ---------- */
  .hero { margin: 4px 16px 24px; border-radius: 20px; overflow: hidden; position: relative; min-height: 230px; display: flex; align-items: flex-end;
          background: linear-gradient(120deg, rgba(45,212,191,.16), rgba(139,92,246,.20)), rgba(255,255,255,.03); border: 1px solid var(--line); }
  .hero .logo { position: absolute; right: 30px; top: 50%; -webkit-transform: translateY(-50%); transform: translateY(-50%); width: 36%; max-width: 250px; height: 56%; background: center/contain no-repeat; }
  .hero .info { position: relative; padding: 24px; max-width: 62%; }
  .kicker { display: inline-flex; align-items: center; font-size: 11px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--teal); font-weight: 800; padding: 5px 10px; border-radius: 14px; background: rgba(45,212,191,.1); border: 1px solid rgba(45,212,191,.25); }
  .kicker:before { content: ""; width: 6px; height: 6px; border-radius: 3px; background: var(--teal); margin-right: 7px; }
  .hero h2 { margin: 12px 0 4px; font-size: 32px; line-height: 1.05; letter-spacing: -.5px; }
  .hero p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .btn { display: inline-flex; align-items: center; height: 46px; padding: 0 22px; border-radius: 23px; font-weight: 700; }
  .btn svg { width: 18px; height: 18px; margin-right: 8px; }
  .btn.primary { background: var(--grad); color: #06121a; box-shadow: 0 8px 24px rgba(45,212,191,.25); }
  .btn.ghost { background: rgba(255,255,255,.07); border: 1px solid var(--line); margin-left: 8px; }
  .btn:active { opacity: .8; }

  .row { margin-bottom: 24px; }
  .row-head { display: flex; align-items: baseline; padding: 0 20px 10px; }
  .row-head h3 { margin: 0; font-size: 18px; flex: 1; }
  .row-head button { color: var(--muted); font-size: 14px; padding: 6px 0 6px 12px; }
  .strip { display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 0 12px 4px 20px; }
  .strip::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }
  .strip .card { flex: 0 0 150px; width: 150px; margin-right: 12px; }
  .foot { padding: 4px 20px 20px; font-size: 12px; color: #5e6370; }

  .card { display: block; width: 100%; min-width: 0; overflow: hidden; }
  .tile { position: relative; height: 90px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .card:active .tile { -webkit-transform: scale(.96); transform: scale(.96); }
  .card.now .tile { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal) inset; }
  .tile img { max-width: 74%; max-height: 64%; opacity: 0; -webkit-transition: opacity .2s; transition: opacity .2s; }
  .tile img.ok, .lg img.ok { opacity: 1; }
  .ini { position: absolute; font-weight: 800; font-size: 24px; color: #3b404c; }
  .ini.gone { display: none; }
  .tile .q { position: absolute; right: 7px; bottom: 6px; font-size: 10px; font-weight: 700; background: rgba(0,0,0,.6); color: #ddd; padding: 1px 6px; border-radius: 5px; }
  .tile .star { position: absolute; left: 8px; top: 5px; color: var(--teal); font-size: 13px; }
  .card .name { margin-top: 7px; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); grid-gap: 18px 12px; padding: 0 20px; }

  .chips { display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 0 16px; }
  .chip { flex: 0 0 auto; height: 36px; padding: 0 15px; margin-right: 8px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 14px; font-weight: 600; white-space: nowrap; }
  .chip.on { background: var(--grad); color: #06121a; border-color: transparent; }

  /* ---------- Ao vivo ---------- */
  .live { position: fixed; top: var(--navh); left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; padding-top: 8px; }
  .live-main { flex: 0 0 auto; padding: 0 14px; }
  .live-list { flex: 1 1 auto; min-height: 0; min-width: 0; display: flex; flex-direction: column; padding-top: 12px; }
  .live-list .chips { flex: 0 0 auto; margin-bottom: 8px; }
  .list { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 10px 100px; }
  @media (min-width: 900px) and (orientation: landscape) {
    .live { flex-direction: row-reverse; }
    .live-main { flex: 1 1 0%; min-width: 0; overflow-y: auto; padding: 0 16px 0 6px; }
    .live-list { flex: 0 0 340px; width: 340px; min-width: 0; padding-top: 0; }
  }

  .ch { display: flex; align-items: center; width: 100%; padding: 8px 8px; border-radius: 12px; margin-bottom: 2px; }
  .ch:active { background: rgba(255,255,255,.06); }
  .ch.on { background: linear-gradient(90deg, rgba(45,212,191,.16), rgba(139,92,246,.10)); box-shadow: inset 3px 0 0 var(--teal); }
  .ch .num { flex: 0 0 36px; font-size: 13px; font-weight: 700; color: var(--muted); text-align: right; margin-right: 10px; font-variant-numeric: tabular-nums; }
  .lg { position: relative; flex: 0 0 56px; height: 38px; border-radius: 9px; background: var(--panel2); display: flex; align-items: center; justify-content: center; overflow: hidden; margin-right: 12px; }
  .lg img { max-width: 80%; max-height: 72%; opacity: 0; -webkit-transition: opacity .2s; transition: opacity .2s; }
  .lg .ini { font-size: 14px; color: #5a5f6c; }
  .ch .tx { flex: 1 1 auto; min-width: 0; }
  .ch b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch .fav { color: var(--teal); font-size: 13px; margin-left: 6px; }
  .live-badge { display: inline-block; background: var(--red); color: #fff; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; letter-spacing: .6px; }
  .ch .live-badge { margin-left: 8px; flex: 0 0 auto; }

  /* Player */
  .pbox { position: relative; width: 100%; padding-top: 56.25%; border-radius: 16px; overflow: hidden; background: #000; border: 1px solid var(--line); }
  .pbox > * { position: absolute; }
  #video { top: 0; left: 0; width: 100%; height: 100%; background: #000; }
  #tap { top: 0; left: 0; right: 0; bottom: 0; }
  .pempty { top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); font-size: 15px;
            background: radial-gradient(60% 70% at 50% 40%, rgba(139,92,246,.18), rgba(0,0,0,0)), #07080d; }
  .pempty svg { width: 46px; height: 46px; color: #3e4350; margin-bottom: 10px; }
  .ui { -webkit-transition: opacity .25s; transition: opacity .25s; }
  .pbox.idle .ui { opacity: 0; pointer-events: none; }
  .x-top { display: none; top: 0; left: 0; right: 0; align-items: center; padding: calc(10px + env(safe-area-inset-top)) 12px 34px; background: linear-gradient(rgba(0,0,0,.8), rgba(0,0,0,0)); }
  .x-title { flex: 1; min-width: 0; margin-left: 6px; }
  .x-title b { display: block; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .x-title span { font-size: 12px; color: #c9ccd2; }
  .p-mid { top: 50%; left: 50%; -webkit-transform: translate(-50%, -50%); transform: translate(-50%, -50%); display: flex; align-items: center; }
  .round { width: 48px; height: 48px; border-radius: 24px; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; margin: 0 14px; }
  .round.big { width: 64px; height: 64px; border-radius: 32px; }
  .round.big svg { width: 32px; height: 32px; }
  .round:active { background: rgba(255,255,255,.22); }
  .p-bot { left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: flex-end; padding: 24px 10px 10px; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.65)); }
  .pill { display: inline-flex; align-items: center; height: 40px; padding: 0 15px; border-radius: 20px; background: rgba(255,255,255,.16); font-weight: 700; font-size: 14px; margin-left: 8px; }
  .pill svg { width: 19px; height: 19px; margin-right: 6px; }
  .pill.icon { width: 40px; padding: 0; justify-content: center; }
  .pill.icon svg { margin: 0; }
  .pill.accent { background: var(--grad); color: #06121a; }
  .pill:active { opacity: .75; }
  .xonly { display: none !important; }

  #msg { top: 50%; left: 50%; -webkit-transform: translate(-50%, 34px); transform: translate(-50%, 34px); text-align: center; width: 86%; max-width: 420px; }
  #msg p { margin: 10px 0 12px; color: #ddd; font-size: 14px; }
  .spin { width: 34px; height: 34px; margin: 0 auto; border-radius: 17px; border: 3px solid rgba(255,255,255,.18); border-top-color: var(--teal); -webkit-animation: sp .9s linear infinite; animation: sp .9s linear infinite; }
  @-webkit-keyframes sp { to { -webkit-transform: rotate(360deg); } }
  @keyframes sp { to { transform: rotate(360deg); } }
  #msg.err { -webkit-transform: translate(-50%, -50%); transform: translate(-50%, -50%); background: rgba(10,10,14,.85); border-radius: 16px; padding: 18px; }
  #msg.err .spin { display: none; }

  /* Player ampliado (ocupa a tela toda dentro da página) */
  body.xp .nav, body.xp .mini { display: none; }
  .pbox.expanded { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: auto; padding-top: 0; border-radius: 0; border: 0; z-index: 80; }
  .pbox.expanded .x-top { display: flex; }
  .pbox.expanded .xonly { display: inline-flex !important; }
  .pbox.expanded .ionly { display: none !important; }
  .pbox.expanded .round { width: 58px; height: 58px; border-radius: 29px; margin: 0 22px; }
  .pbox.expanded .round.big { width: 78px; height: 78px; border-radius: 39px; }
  .pbox.expanded .p-bot { padding: 30px 14px calc(14px + env(safe-area-inset-bottom)); }
  .pbox.sheet .p-bot, .pbox.sheet .p-mid, .pbox.sheet #msg { opacity: 0; pointer-events: none; }

  #sheet { display: none; left: 0; right: 0; bottom: 0; z-index: 5; padding: 14px 0 calc(16px + env(safe-area-inset-bottom));
           background: rgba(12,13,19,.95); -webkit-backdrop-filter: blur(18px); border-radius: 20px 20px 0 0; border-top: 1px solid var(--line);
           -webkit-transform: translateY(105%); transform: translateY(105%); -webkit-transition: -webkit-transform .28s ease; transition: transform .28s ease; }
  .pbox.expanded #sheet { display: block; }
  #sheet.open { -webkit-transform: none; transform: none; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: #555; margin: -4px auto 10px; }
  .sheet-head { display: flex; align-items: center; padding: 0 10px 10px 18px; }
  .sheet-head b { flex: 1; font-size: 17px; }
  #sheet .chips { margin-bottom: 12px; }
  #sheet .strip .card { flex-basis: 136px; width: 136px; }

  /* Cartão "ao vivo" */
  .nowcard { display: flex; align-items: center; margin-top: 12px; padding: 12px 14px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); }
  .nowcard .lg { flex-basis: 64px; height: 44px; }
  .now-tx { flex: 1; min-width: 0; }
  .now-tx b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
  .now-tx small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now-actions { display: flex; align-items: center; margin-left: 8px; }
  .now-actions .iconbtn { background: rgba(255,255,255,.06); margin-left: 6px; }
  .on-teal { color: var(--teal); }

  /* ---------- Rádios ---------- */
  .rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); grid-gap: 16px 12px; padding: 14px 20px 0; }
  .radio { display: block; width: 100%; min-width: 0; }
  .radio .tile { height: auto; padding-top: 100%; }
  .radio .tile > * { position: absolute; }
  .radio .tile img { top: 14%; left: 14%; width: 72%; height: 72%; max-width: none; max-height: none; object-fit: contain; }
  .radio .tile .ini { top: 50%; left: 50%; -webkit-transform: translate(-50%, -50%); transform: translate(-50%, -50%); }
  .radio.now .tile { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal) inset; }
  .radio .name { margin-top: 7px; font-size: 13px; font-weight: 600; line-height: 1.25; max-height: 33px; overflow: hidden; }
  .eq { right: 8px; bottom: 8px; display: none; height: 14px; }
  .radio.now .eq { display: flex; align-items: flex-end; }
  .eq i { width: 3px; margin-left: 2px; background: var(--teal); -webkit-animation: eq 1s ease-in-out infinite; animation: eq 1s ease-in-out infinite; }
  .eq i:nth-child(2) { -webkit-animation-delay: .2s; animation-delay: .2s; }
  .eq i:nth-child(3) { -webkit-animation-delay: .4s; animation-delay: .4s; }
  @-webkit-keyframes eq { 0%,100% { height: 4px; } 50% { height: 14px; } }
  @keyframes eq { 0%,100% { height: 4px; } 50% { height: 14px; } }
  .paused .eq i { -webkit-animation: none; animation: none; height: 4px; }

  .mini { position: fixed; z-index: 45; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); -webkit-transform: translateX(-50%); transform: translateX(-50%);
          width: calc(100% - 28px); max-width: 520px; display: flex; align-items: center; padding: 8px; border-radius: 22px;
          background: rgba(18,19,27,.92); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  .mini .lg { flex-basis: 48px; height: 48px; margin-right: 12px; }
  .mini .tx { flex: 1; min-width: 0; }
  .mini b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini small { font-size: 12px; color: var(--muted); }
  .mini .iconbtn { margin-left: 4px; }
  .mini .play { background: var(--grad); color: #06121a; }

  /* ---------- Busca ---------- */
  .search { display: flex; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; margin: 4px 20px 18px; padding: 0 14px; height: 50px; }
  .search svg { color: var(--muted); margin-right: 10px; }
  .search input { flex: 1; background: none; border: 0; outline: 0; height: 46px; font-size: 17px; -webkit-appearance: none; min-width: 0; }
  .sec-title { margin: 0 20px 12px; font-size: 16px; color: var(--muted); font-weight: 700; }

  /* ---------- Ajustes ---------- */
  .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 90; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .box { background: #12131a; border: 1px solid var(--line); border-radius: 20px; width: 100%; max-width: 480px; padding: 22px; }
  .box h3 { margin: 0 0 4px; font-size: 20px; }
  .box p { color: var(--muted); font-size: 13px; margin: 4px 0 14px; }
  .box label { display: block; font-size: 13px; font-weight: 700; margin: 14px 0 6px; }
  .box input { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; -webkit-appearance: none; }
  .box .actions { display: flex; justify-content: flex-end; margin-top: 18px; }
  .box .btn { height: 42px; padding: 0 18px; font-size: 15px; }
  .linkish { color: #ff8a8a; font-size: 14px; margin-top: 6px; }
</style>
</head>
<body>
<div class="glow"></div>

<!-- ===== Navegação ===== -->
<header class="nav">
  <div class="brand"><i></i>TV</div>
  <nav class="tabs">
    <button class="tab" data-tab="search"><svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 015.6 11.2l4.6 4.6-1.4 1.4-4.6-4.6A7 7 0 1110 3zm0 2a5 5 0 100 10 5 5 0 000-10z"/></svg>Buscar</button>
    <button class="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M12 3l9 7.5V21h-6.5v-6h-5v6H3V10.5z"/></svg>Início</button>
    <button class="tab" data-tab="live"><svg viewBox="0 0 24 24"><path d="M8.5 2.6L12 6.1l3.5-3.5 1.4 1.4L14.9 6H20a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2V8a2 2 0 012-2h5.1L7.1 4zM4 8v10h16V8z"/></svg>Ao vivo</button>
    <button class="tab" data-tab="fav"><svg viewBox="0 0 24 24"><path d="M12 21l-1.4-1.3C5.4 15 2 11.9 2 8.1 2 5 4.4 2.6 7.5 2.6c1.7 0 3.4.8 4.5 2.1 1.1-1.3 2.8-2.1 4.5-2.1 3.1 0 5.5 2.4 5.5 5.5 0 3.8-3.4 6.9-8.6 11.6z"/></svg>Favoritos</button>
    <button class="tab" data-tab="radio"><svg viewBox="0 0 24 24"><path d="M3.2 6.3L17.8 1l.7 1.9L8.6 6.5H20a2 2 0 012 2v11a2 2 0 01-2 2H4a2 2 0 01-2-2v-11c0-1 .5-1.8 1.2-2.2zM4 8.5v11h16v-11zm4 2.5a3 3 0 110 6 3 3 0 010-6zm6 1h4v2h-4zm0 3h4v2h-4z"/></svg>Rádios</button>
  </nav>
  <div class="nav-right">
    <span id="clock"></span>
    <button class="iconbtn" data-act="settings" aria-label="Ajustes"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 110 7 3.5 3.5 0 010-7zm8.4 2.3l-1.9-.4a6.9 6.9 0 00-.7-1.6l1-1.6-1.9-1.9-1.6 1a6.9 6.9 0 00-1.6-.7L13.3 3h-2.6l-.4 1.9a6.9 6.9 0 00-1.6.7l-1.6-1-1.9 1.9 1 1.6a6.9 6.9 0 00-.7 1.6L3.6 11v2.6l1.9.4c.2.6.4 1.1.7 1.6l-1 1.6 1.9 1.9 1.6-1c.5.3 1 .5 1.6.7l.4 1.9h2.6l.4-1.9c.6-.2 1.1-.4 1.6-.7l1.6 1 1.9-1.9-1-1.6c.3-.5.5-1 .7-1.6l1.9-.4V11z"/></svg></button>
  </div>
</header>

<!-- ===== Início ===== -->
<main id="v-home" class="view page"><div class="empty">Carregando canais…</div></main>

<!-- ===== Ao vivo ===== -->
<section id="v-live" class="view live hidden">
  <div class="live-main">
    <div id="pbox" class="pbox">
      <video id="video" playsinline webkit-playsinline preload="none"></video>
      <div id="pempty" class="pempty"><svg viewBox="0 0 24 24"><path d="M4 6h16a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2V8a2 2 0 012-2zm0 2v10h16V8zm6 1.5l5 3.5-5 3.5z"/></svg>Escolha um canal na lista</div>
      <div id="tap"></div>
      <div id="msg" class="hidden"><div class="spin"></div><p id="msgText"></p><div id="msgActions"></div></div>
      <div class="ui x-top">
        <button class="iconbtn" data-act="shrink" aria-label="Sair da tela cheia"><svg viewBox="0 0 24 24"><path d="M15.4 5.4L14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg></button>
        <div class="x-title"><b id="xName"></b><span><span class="live-badge">AO VIVO</span> <span id="xSub"></span></span></div>
        <button class="iconbtn" data-act="fav" id="xFav" aria-label="Favorito"><svg viewBox="0 0 24 24"><path d="M12 17.3l-6.2 3.7 1.6-7L2 9.2l7.1-.6L12 2l2.9 6.6 7.1.6-5.4 4.8 1.6 7z"/></svg></button>
        <button class="iconbtn pipbtn hidden" data-act="pip" aria-label="Janela flutuante"><svg viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 011 1v12a1 1 0 01-1 1H3a1 1 0 01-1-1V6a1 1 0 011-1zm1 2v10h16V7zm8 4h7v5h-7z"/></svg></button>
      </div>
      <div class="ui p-mid">
        <button class="round" data-act="prev" aria-label="Canal anterior"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 18V6z"/></svg></button>
        <button class="round big" data-act="toggle" aria-label="Tocar ou pausar"><svg viewBox="0 0 24 24" id="ppIcon"><path d="M7 4v16l13-8z"/></svg></button>
        <button class="round" data-act="next" aria-label="Próximo canal"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      </div>
      <div class="ui p-bot">
        <button class="pill xonly" data-act="native"><svg viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5zm9 0h5v5h-2V7h-3zM5 14h2v3h3v2H5zm12 0h2v5h-5v-2h3z"/></svg>Tela cheia</button>
        <button class="pill accent xonly" data-act="openSheet"><svg viewBox="0 0 24 24"><path d="M3 5h18v2H3zm0 6h18v2H3zm0 6h18v2H3z"/></svg>Canais</button>
        <button class="pill icon ionly" data-act="expand" aria-label="Ampliar"><svg viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5zm9 0h5v5h-2V7h-3zM5 14h2v3h3v2H5zm12 0h2v5h-5v-2h3z"/></svg></button>
      </div>
      <div id="sheet">
        <div class="grab"></div>
        <div class="sheet-head"><b>Canais</b>
          <button class="iconbtn" data-act="closeSheet" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M18.3 7.1L16.9 5.7 12 10.6 7.1 5.7 5.7 7.1l4.9 4.9-4.9 4.9 1.4 1.4 4.9-4.9 4.9 4.9 1.4-1.4-4.9-4.9z"/></svg></button></div>
        <div class="chips" id="sheetChips"></div>
        <div class="strip" id="sheetStrip"></div>
      </div>
    </div>
    <div class="nowcard" id="nowcard">
      <div class="lg" id="nowLogo"></div>
      <div class="now-tx"><span class="live-badge">AO VIVO</span><b id="nowName">Nenhum canal</b><small id="nowSub">Toque num canal para assistir</small></div>
      <div class="now-actions">
        <button class="iconbtn" data-act="fav" id="nowFav" aria-label="Favorito"><svg viewBox="0 0 24 24"><path d="M12 17.3l-6.2 3.7 1.6-7L2 9.2l7.1-.6L12 2l2.9 6.6 7.1.6-5.4 4.8 1.6 7z"/></svg></button>
        <button class="iconbtn pipbtn hidden" data-act="pip" aria-label="Janela flutuante"><svg viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 011 1v12a1 1 0 01-1 1H3a1 1 0 01-1-1V6a1 1 0 011-1zm1 2v10h16V7zm8 4h7v5h-7z"/></svg></button>
        <button class="iconbtn" data-act="expand" aria-label="Ampliar"><svg viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5zm9 0h5v5h-2V7h-3zM5 14h2v3h3v2H5zm12 0h2v5h-5v-2h3z"/></svg></button>
      </div>
    </div>
  </div>
  <div class="live-list">
    <div class="chips" id="liveChips"></div>
    <div class="list" id="liveList"></div>
  </div>
</section>

<!-- ===== Favoritos ===== -->
<section id="v-fav" class="view page hidden"><h2>Favoritos</h2><div id="favOut"></div></section>

<!-- ===== Rádios ===== -->
<section id="v-radio" class="view page hidden"><h2>Rádios</h2><div class="chips" id="radioChips"></div><div class="rgrid" id="radioGrid"></div></section>

<!-- ===== Busca ===== -->
<section id="v-search" class="view page hidden">
  <div class="search"><svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 015.6 11.2l4.6 4.6-1.4 1.4-4.6-4.6A7 7 0 1110 3zm0 2a5 5 0 100 10 5 5 0 000-10z"/></svg>
    <input id="q" type="search" placeholder="Buscar canais e rádios" autocomplete="off" autocorrect="off" autocapitalize="off"></div>
  <div id="searchOut"></div>
</section>

<!-- ===== Mini player de rádio ===== -->
<div id="mini" class="mini hidden">
  <div class="lg" id="miniLogo"></div>
  <div class="tx"><b id="miniName"></b><small id="miniSub">Rádio · ao vivo</small></div>
  <button class="iconbtn play" data-act="radioToggle" aria-label="Tocar ou pausar"><svg viewBox="0 0 24 24" id="miniIcon"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg></button>
  <button class="iconbtn" data-act="radioClose" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M18.3 7.1L16.9 5.7 12 10.6 7.1 5.7 5.7 7.1l4.9 4.9-4.9 4.9 1.4 1.4 4.9-4.9 4.9 4.9 1.4-1.4-4.9-4.9z"/></svg></button>
</div>
<audio id="audio" preload="none"></audio>

<!-- ===== Ajustes ===== -->
<div id="settings" class="modal hidden">
  <div class="box">
    <h3>Ajustes</h3>
    <p id="updatedInfo"></p>
    <label for="customUrl">Minha lista (.m3u)</label>
    <input id="customUrl" type="url" placeholder="https://…/lista.m3u" autocapitalize="off" autocorrect="off">
    <p>Opcional. Fica salva só neste iPad e aparece como “Minha lista”.</p>
    <button class="linkish" data-act="clearData">Apagar favoritos e histórico</button>
    <div class="actions">
      <button class="btn ghost" data-act="closeSettings">Cancelar</button>
      <button class="btn primary" data-act="saveSettings">Salvar</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  function trim(s) { return (s || '').replace(/^\s+|\s+$/g, ''); }
  function joinInfo(c) { var a = []; if (c.g) a.push(c.g); if (c.q) a.push(c.q); return a.join(' · '); }

  // ================= Estado =================
  var CH = [], CATS = [], byUrl = {}, updated = '';
  var RADIOS = [], RCATS = [];
  var favs = LS.get('tv2.favs', []), recents = LS.get('tv2.recents', []), favData = LS.get('tv2.favData', {});
  var lists = {};            // chave -> canais (contexto para anterior/próximo)
  var cur = null;            // {key, pos}
  var liveKey = LS.get('tv3.liveKey', 'all');
  var tab = 'home';

  var GROUPS = { General: 'Geral', Entertainment: 'Entretenimento', Movies: 'Filmes', Music: 'Música', News: 'Notícias',
    Religious: 'Religioso', Kids: 'Infantil', Series: 'Séries', Sports: 'Esportes', Documentary: 'Documentários',
    Shop: 'Compras', Culture: 'Cultura', Education: 'Educação', Lifestyle: 'Estilo de vida', Comedy: 'Comédia',
    Animation: 'Animação', Business: 'Negócios', Classic: 'Clássicos', Family: 'Família', Legislative: 'Legislativo',
    Outdoor: 'Natureza', Science: 'Ciência', Travel: 'Viagem', Weather: 'Clima', Cooking: 'Culinária', Auto: 'Automóveis',
    Relax: 'Relax', Public: 'Pública', Interactive: 'Interativo', Undefined: '' };
  function groupPt(g) {
    if (!g) return '';
    var parts = g.split(/\s*[·;]\s*/), out = [];
    for (var i = 0; i < parts.length; i++) { var t = GROUPS.hasOwnProperty(parts[i]) ? GROUPS[parts[i]] : parts[i]; if (t && out.indexOf(t) < 0) out.push(t); }
    return out.slice(0, 2).join(' · ');
  }
  function initials(n) { var m = trim(n.replace(/[^A-Za-z0-9À-ÿ ]/g, '')).split(/\s+/); return ((m[0] || '').charAt(0) + (m[1] || '').charAt(0)).toUpperCase() || 'TV'; }
  function isFav(u) { return favs.indexOf(u) > -1; }
  function fromUrls(urls) { var out = []; for (var i = 0; i < urls.length; i++) { var c = byUrl[urls[i]] || favData[urls[i]]; if (c) out.push(c); } return out; }

  function listFor(key) {
    if (key === 'all') return CH;
    if (key === 'fav') return fromUrls(favs);
    if (key === 'recent') return fromUrls(recents);
    if (key === 'search') return lists.search || [];
    for (var i = 0; i < CATS.length; i++) if (CATS[i].id === key) return CATS[i].items;
    return [];
  }
  function catName(key) {
    var names = { all: 'Todos', fav: 'Favoritos', recent: 'Recentes', search: 'Busca' };
    if (names[key]) return names[key];
    for (var i = 0; i < CATS.length; i++) if (CATS[i].id === key) return CATS[i].name;
    return '';
  }
  function chipKeys() {
    var k = ['all'];
    if (favs.length) k.push('fav');
    if (recents.length) k.push('recent');
    for (var i = 0; i < CATS.length; i++) k.push(CATS[i].id);
    return k;
  }

  // ================= Imagens sob demanda =================
  var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function (es) {
    for (var i = 0; i < es.length; i++) if (es[i].isIntersecting) { loadImg(es[i].target); io.unobserve(es[i].target); }
  }, { rootMargin: '300px' }) : null;
  function loadImg(img) {
    img.onload = function () { img.className = 'ok'; var p = img.previousSibling; if (p && p.className === 'ini') p.className = 'ini gone'; };
    img.onerror = function () { if (img.parentNode) img.parentNode.removeChild(img); };
    img.src = img.getAttribute('data-src');
  }
  function logoInto(el, c, lazy) {
    el.innerHTML = '';
    var ini = document.createElement('span'); ini.className = 'ini'; ini.textContent = initials(c.n); el.appendChild(ini);
    if (c.l) {
      var img = document.createElement('img'); img.alt = ''; img.setAttribute('data-src', c.l); el.appendChild(img);
      if (lazy && io) io.observe(img); else loadImg(img);
    }
  }
  function isCurrent(c) { var x = current(); return !!(x && x.u === c.u); }

  // ================= Componentes =================
  function card(c, key, pos) {
    var b = document.createElement('button');
    b.className = 'card' + (isCurrent(c) ? ' now' : '');
    b.setAttribute('data-k', key); b.setAttribute('data-p', pos);
    var t = document.createElement('div'); t.className = 'tile'; logoInto(t, c, true);
    if (c.q) { var q = document.createElement('span'); q.className = 'q'; q.textContent = c.q; t.appendChild(q); }
    if (isFav(c.u)) { var s = document.createElement('span'); s.className = 'star'; s.textContent = '★'; t.appendChild(s); }
    var n = document.createElement('div'); n.className = 'name'; n.textContent = c.n;
    var g = document.createElement('div'); g.className = 'sub'; g.textContent = c.g || (c.pt ? 'Português' : '');
    b.appendChild(t); b.appendChild(n); b.appendChild(g);
    return b;
  }
  function chRow(c, key, pos) {
    var b = document.createElement('button');
    b.className = 'ch' + (isCurrent(c) ? ' on' : '');
    b.setAttribute('data-k', key); b.setAttribute('data-p', pos);
    var num = document.createElement('span'); num.className = 'num'; num.textContent = c.num || '';
    var lg = document.createElement('span'); lg.className = 'lg'; logoInto(lg, c, true);
    var tx = document.createElement('span'); tx.className = 'tx';
    var nb = document.createElement('b'); nb.textContent = c.n;
    var sm = document.createElement('small'); sm.textContent = joinInfo(c) || (c.pt ? 'Português' : '');
    tx.appendChild(nb); tx.appendChild(sm);
    b.appendChild(num); b.appendChild(lg); b.appendChild(tx);
    if (isFav(c.u)) { var f = document.createElement('span'); f.className = 'fav'; f.textContent = '★'; b.appendChild(f); }
    if (isCurrent(c)) { var lb = document.createElement('span'); lb.className = 'live-badge'; lb.textContent = 'AO VIVO'; b.appendChild(lb); }
    return b;
  }
  function chipsInto(el, keys, active, labels) {
    el.innerHTML = '';
    for (var k = 0; k < keys.length; k++) {
      var b = document.createElement('button'); b.className = 'chip' + (keys[k] === active ? ' on' : '');
      b.textContent = labels ? labels[k] : catName(keys[k]); b.setAttribute('data-chip', keys[k]);
      el.appendChild(b);
    }
  }

  // ================= Abas =================
  var VIEWS = { home: 'v-home', live: 'v-live', fav: 'v-fav', radio: 'v-radio', search: 'v-search' };
  function show(t) {
    if (tab === 'live' && t !== 'live' && video.webkitPresentationMode !== 'picture-in-picture' && !video.paused) video.pause();
    tab = t; LS.set('tv3.tab', t === 'search' ? 'home' : t);
    for (var k in VIEWS) $(VIEWS[k]).classList.toggle('hidden', k !== t);
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) tabs[i].classList.toggle('on', tabs[i].getAttribute('data-tab') === t);
    document.body.classList.toggle('live-on', t === 'live');
    window.scrollTo(0, 0);
    if (t === 'home') renderHome();
    if (t === 'live') renderLive();
    if (t === 'fav') renderFav();
    if (t === 'radio') renderRadios();
    if (t === 'search') { renderSearch(); setTimeout(function () { $('q').focus(); }, 60); }
  }

  // ================= Início =================
  var ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';
  function renderHome() {
    var home = $('v-home'); home.innerHTML = '';
    if (!CATS.length) { home.innerHTML = '<div class="empty">Não foi possível carregar os canais. Verifique a internet e abra de novo.</div>'; return; }
    var rec = fromUrls(recents);
    var heroKey = rec.length ? 'recent' : CATS[0].id, hero = listFor(heroKey)[0];
    lists[heroKey] = listFor(heroKey);
    var h = document.createElement('div'); h.className = 'hero';
    h.innerHTML = '<div class="logo"></div><div class="info"><span class="kicker"></span><h2></h2><p></p>' +
      '<button class="btn primary" data-k="' + heroKey + '" data-p="0">' + ICON_PLAY + 'Assistir agora</button>' +
      '<button class="btn ghost" data-tab="live">Ver canais</button></div>';
    h.querySelector('.kicker').appendChild(document.createTextNode(rec.length ? 'Continuar assistindo' : 'Em destaque'));
    h.querySelector('h2').textContent = hero.n;
    h.querySelector('p').textContent = (hero.num ? 'Canal ' + hero.num + ' · ' : '') + (hero.g || catName(heroKey));
    if (hero.l) h.querySelector('.logo').style.backgroundImage = 'url("' + hero.l + '")';
    home.appendChild(h);

    var keys = [];
    if (favs.length) keys.push('fav');
    if (rec.length) keys.push('recent');
    for (var i = 0; i < CATS.length; i++) keys.push(CATS[i].id);
    for (var r = 0; r < keys.length; r++) {
      var key = keys[r], items = listFor(key);
      if (!items.length) continue;
      lists[key] = items;
      var row = document.createElement('section'); row.className = 'row';
      var head = document.createElement('div'); head.className = 'row-head';
      var t = document.createElement('h3'); t.textContent = key === 'recent' ? 'Assistidos recentemente' : catName(key); head.appendChild(t);
      if (items.length > 12) { var more = document.createElement('button'); more.textContent = 'Ver todos (' + items.length + ') ›'; more.setAttribute('data-golive', key); head.appendChild(more); }
      var strip = document.createElement('div'); strip.className = 'strip';
      for (var j = 0; j < items.length && j < 16; j++) strip.appendChild(card(items[j], key, j));
      row.appendChild(head); row.appendChild(strip); home.appendChild(row);
    }
    var foot = document.createElement('div'); foot.className = 'foot';
    foot.textContent = CH.length + ' canais e ' + RADIOS.length + ' rádios verificados' + (updated ? ' · atualizado em ' + fmtDate(updated) : '') + '. Fontes públicas e gratuitas (iptv-org, Free-TV, Radio Browser).';
    home.appendChild(foot);
  }
  function fmtDate(iso) { var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('pt-BR') + ' às ' + ('0' + d.getHours()).slice(-2) + 'h'; }

  // ================= Ao vivo =================
  var liveItems = [], liveShown = 0;
  function renderLive() {
    if (!listFor(liveKey).length) liveKey = 'all';
    chipsInto($('liveChips'), chipKeys(), liveKey);
    liveItems = listFor(liveKey); lists[liveKey] = liveItems;
    var list = $('liveList'); list.innerHTML = ''; liveShown = 0;
    updateNow();
    if (!liveItems.length) { list.innerHTML = '<div class="empty">Nenhum canal aqui ainda.</div>'; return; }
    var target = 0, c = current();
    if (c) for (var i = 0; i < liveItems.length; i++) if (liveItems[i].u === c.u) { target = i; break; }
    moreLive(Math.max(60, target + 20));
    if (c && list.children[target]) list.scrollTop = Math.max(0, list.children[target].offsetTop - 80);
    var chip = $('liveChips').querySelector('.chip.on'); if (chip) $('liveChips').scrollLeft = Math.max(0, chip.offsetLeft - 16);
  }
  function moreLive(n) {
    var frag = document.createDocumentFragment(), end = Math.min(liveShown + (n || 60), liveItems.length);
    for (var i = liveShown; i < end; i++) frag.appendChild(chRow(liveItems[i], liveKey, i));
    $('liveList').appendChild(frag); liveShown = end;
  }
  $('liveList').addEventListener('scroll', function () {
    var l = $('liveList');
    if (liveShown < liveItems.length && l.scrollTop + l.clientHeight > l.scrollHeight - 500) moreLive();
  });
  // Redesenha só as linhas cujo estado mudou (atual / favorito).
  function refreshRows(onlyUrl) {
    var rows = $('liveList').children;
    for (var i = rows.length - 1; i >= 0; i--) {
      var p = +rows[i].getAttribute('data-p'), it = liveItems[p];
      if (!it || !rows[i].hasAttribute('data-k')) continue;
      var changed = onlyUrl ? it.u === onlyUrl : (isCurrent(it) !== rows[i].classList.contains('on'));
      if (changed) rows[i].parentNode.replaceChild(chRow(it, liveKey, p), rows[i]);
    }
  }
  function updateNow() {
    var c = current();
    $('nowName').textContent = c ? (c.num ? c.num + ' · ' : '') + c.n : 'Nenhum canal';
    $('nowSub').textContent = c ? (joinInfo(c) || catName(cur.key)) : 'Toque num canal para assistir';
    if (c) logoInto($('nowLogo'), c, false); else $('nowLogo').innerHTML = '';
    $('xName').textContent = c ? (c.num ? c.num + ' · ' : '') + c.n : '';
    $('xSub').textContent = c ? joinInfo(c) : '';
    var fav = !!(c && isFav(c.u));
    $('nowFav').classList.toggle('on-teal', fav); $('xFav').classList.toggle('on-teal', fav);
    $('pempty').classList.toggle('hidden', !!c);
  }

  // ================= Player =================
  var video = $('video'), pbox = $('pbox'), idleTimer, watchdog, sheetKey = null;
  function current() { return cur && lists[cur.key] ? lists[cur.key][cur.pos] : null; }
  function showMsg(text, isErr, actions) { $('msg').className = isErr ? 'err' : ''; $('msgText').textContent = text; $('msgActions').innerHTML = actions || ''; }
  function hideMsg() { $('msg').className = 'hidden'; }

  function play(key, pos) {
    var list = lists[key] || listFor(key);
    if (!list.length) return;
    lists[key] = list;
    pos = (pos + list.length) % list.length;
    cur = { key: key, pos: pos };
    var c = list[pos];
    stopRadio(true);
    showMsg('Sintonizando…', false);
    clearTimeout(watchdog);
    watchdog = setTimeout(function () { if (video.paused || video.readyState < 2) failed(); }, 15000);
    video.src = c.u; video.load();
    var p = video.play(); if (p && p.catch) p.catch(function () {});
    addRecent(c); updateNow(); refreshRows(); wake();
    if ($('sheet').classList.contains('open')) openSheet(sheetKey);
  }
  function failed() {
    clearTimeout(watchdog);
    if (!current()) return;
    showMsg('Este canal não está respondendo agora.', true,
      '<button class="pill accent" data-act="next">Próximo canal</button><button class="pill" data-act="retry">Tentar de novo</button>');
    wake(true);
  }
  video.addEventListener('playing', function () { clearTimeout(watchdog); hideMsg(); setPP(); wake(); });
  video.addEventListener('waiting', function () { if (!video.paused) showMsg('Carregando…', false); });
  video.addEventListener('pause', setPP);
  video.addEventListener('play', function () { stopRadio(true); setPP(); });
  video.addEventListener('error', function () { if (video.getAttribute('src')) failed(); });
  function setPP() { $('ppIcon').innerHTML = video.paused ? '<path d="M7 4v16l13-8z"/>' : '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'; }

  function wake(stay) {
    pbox.classList.remove('idle'); clearTimeout(idleTimer);
    if (!stay) idleTimer = setTimeout(function () { if (!video.paused && !$('sheet').classList.contains('open')) pbox.classList.add('idle'); }, 3500);
  }
  $('tap').addEventListener('click', function () {
    if ($('sheet').classList.contains('open')) { closeSheet(); return; }
    if (!current()) return;
    if (pbox.classList.contains('idle')) wake(); else if (!video.paused) { clearTimeout(idleTimer); pbox.classList.add('idle'); }
  });
  function expand(on) {
    if (on && !current()) return;
    pbox.classList.toggle('expanded', on); document.body.classList.toggle('xp', on);
    if (!on) closeSheet();
    wake();
  }

  function addRecent(c) {
    var i = recents.indexOf(c.u); if (i > -1) recents.splice(i, 1);
    recents.unshift(c.u); if (recents.length > 15) recents.length = 15;
    favData[c.u] = c; LS.set('tv2.recents', recents); saveFavData();
  }
  function saveFavData() {
    var keep = {}, all = favs.concat(recents);
    for (var i = 0; i < all.length; i++) if (favData[all[i]]) keep[all[i]] = favData[all[i]];
    favData = keep; LS.set('tv2.favData', favData);
  }
  function toggleFav() {
    var c = current(); if (!c) return;
    var i = favs.indexOf(c.u);
    if (i > -1) favs.splice(i, 1); else { favs.unshift(c.u); favData[c.u] = c; }
    LS.set('tv2.favs', favs); saveFavData(); updateNow(); wake();
    if (tab === 'live') { chipsInto($('liveChips'), chipKeys(), liveKey); refreshRows(c.u); }
  }

  function openSheet(key) {
    sheetKey = key || sheetKey || (cur ? cur.key : 'all');
    chipsInto($('sheetChips'), chipKeys(), sheetKey);
    var strip = $('sheetStrip'); strip.innerHTML = '';
    var items = listFor(sheetKey); lists[sheetKey] = items;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < items.length && i < 150; i++) frag.appendChild(card(items[i], sheetKey, i));
    strip.appendChild(frag);
    $('sheet').classList.add('open'); pbox.classList.add('sheet'); wake(true);
    var c = current();
    if (c) for (var j = 0; j < strip.children.length; j++) if (items[j].u === c.u) { strip.scrollLeft = Math.max(0, strip.children[j].offsetLeft - 18); break; }
    var chip = $('sheetChips').querySelector('.chip.on'); if (chip) $('sheetChips').scrollLeft = Math.max(0, chip.offsetLeft - 16);
  }
  function closeSheet() { $('sheet').classList.remove('open'); pbox.classList.remove('sheet'); wake(); }

  // Janela flutuante (picture-in-picture) do iPad
  if (video.webkitSupportsPresentationMode && video.webkitSupportsPresentationMode('picture-in-picture')) {
    var pips = document.querySelectorAll('.pipbtn');
    for (var pi = 0; pi < pips.length; pi++) pips[pi].classList.remove('hidden');
  }

  // ================= Favoritos =================
  function renderFav() {
    var out = $('favOut'); out.innerHTML = '';
    var items = listFor('fav'); lists.fav = items;
    if (!items.length) { out.innerHTML = '<div class="empty">Toque na estrela ★ de um canal enquanto assiste para guardá-lo aqui.</div>'; return; }
    var g = document.createElement('div'); g.className = 'grid';
    for (var i = 0; i < items.length; i++) g.appendChild(card(items[i], 'fav', i));
    out.appendChild(g);
  }

  // ================= Rádios =================
  var audio = $('audio'), radioNow = null, radioKey = 'all', radioWatch;
  function radioTile(r) {
    var b = document.createElement('button');
    b.setAttribute('data-radio', r.idx);
    var t = document.createElement('div'); t.className = 'tile'; logoInto(t, r, true);
    var eq = document.createElement('span'); eq.className = 'eq'; eq.innerHTML = '<i></i><i></i><i></i>'; t.appendChild(eq);
    var n = document.createElement('div'); n.className = 'name'; n.textContent = r.n;
    b.appendChild(t); b.appendChild(n);
    markRadio(b, r);
    return b;
  }
  function markRadio(el, r) { var on = !!(radioNow && r && r.u === radioNow.u); el.className = 'radio' + (on ? ' now' + (audio.paused ? ' paused' : '') : ''); }
  function radioList(key) {
    if (key === 'all') return RADIOS;
    var out = [];
    for (var i = 0; i < RADIOS.length; i++) if (RADIOS[i].c && RADIOS[i].c.indexOf(key) > -1) out.push(RADIOS[i]);
    return out;
  }
  function renderRadios() {
    var keys = ['all'], labels = ['Todas'];
    for (var i = 0; i < RCATS.length; i++) if (radioList(RCATS[i].id).length) { keys.push(RCATS[i].id); labels.push(RCATS[i].name); }
    chipsInto($('radioChips'), keys, radioKey, labels);
    var g = $('radioGrid'); g.innerHTML = '';
    var items = radioList(radioKey);
    if (!items.length) { g.innerHTML = '<div class="empty">Rádios indisponíveis no momento.</div>'; return; }
    var frag = document.createDocumentFragment();
    for (var j = 0; j < items.length; j++) frag.appendChild(radioTile(items[j]));
    g.appendChild(frag);
  }
  function playRadio(r) {
    if (!video.paused) video.pause();
    radioNow = r;
    $('mini').classList.remove('hidden');
    $('miniName').textContent = r.n; $('miniSub').textContent = 'Conectando…';
    logoInto($('miniLogo'), r, false);
    clearTimeout(radioWatch);
    radioWatch = setTimeout(function () { if (audio.paused || audio.readyState < 2) $('miniSub').textContent = 'Rádio fora do ar agora. Escolha outra.'; }, 12000);
    audio.src = r.u; audio.load();
    var p = audio.play(); if (p && p.catch) p.catch(function () {});
    refreshRadioMarks();
  }
  function stopRadio(keepBar) {
    if (!radioNow) return;
    audio.pause();
    if (!keepBar) { audio.removeAttribute('src'); audio.load(); radioNow = null; $('mini').classList.add('hidden'); }
    refreshRadioMarks();
  }
  function refreshRadioMarks() {
    $('miniIcon').innerHTML = audio.paused ? '<path d="M7 4v16l13-8z"/>' : '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
    var tiles = document.querySelectorAll('[data-radio]');
    for (var i = 0; i < tiles.length; i++) markRadio(tiles[i], RADIOS[+tiles[i].getAttribute('data-radio')]);
  }
  audio.addEventListener('playing', function () { clearTimeout(radioWatch); $('miniSub').textContent = 'Rádio · ao vivo'; refreshRadioMarks(); });
  audio.addEventListener('pause', refreshRadioMarks);
  audio.addEventListener('error', function () { if (audio.getAttribute('src')) { clearTimeout(radioWatch); $('miniSub').textContent = 'Rádio fora do ar agora. Escolha outra.'; refreshRadioMarks(); } });

  // ================= Busca =================
  var qTimer;
  $('q').addEventListener('input', function () { clearTimeout(qTimer); qTimer = setTimeout(renderSearch, 250); });
  function renderSearch() {
    var term = trim($('q').value).toLowerCase(), out = $('searchOut'); out.innerHTML = '';
    if (!term) { out.innerHTML = '<div class="empty">Digite o nome de um canal, uma categoria ou uma rádio.</div>'; return; }
    var chs = [], seen = {}, i;
    for (i = 0; i < CH.length; i++) { var c = CH[i]; if (!seen[c.u] && (c.n + ' ' + (c.g || '') + ' ' + (c.num || '')).toLowerCase().indexOf(term) > -1) { chs.push(c); seen[c.u] = 1; } }
    var rs = [];
    for (i = 0; i < RADIOS.length; i++) if (RADIOS[i].n.toLowerCase().indexOf(term) > -1) rs.push(RADIOS[i]);
    lists.search = chs;
    if (!chs.length && !rs.length) { out.innerHTML = '<div class="empty">Nada encontrado.</div>'; return; }
    if (chs.length) {
      var h = document.createElement('div'); h.className = 'sec-title'; h.textContent = 'Canais (' + chs.length + ')'; out.appendChild(h);
      var g = document.createElement('div'); g.className = 'grid';
      for (i = 0; i < chs.length && i < 120; i++) g.appendChild(card(chs[i], 'search', i));
      out.appendChild(g);
    }
    if (rs.length) {
      var h2 = document.createElement('div'); h2.className = 'sec-title'; h2.style.marginTop = '26px'; h2.textContent = 'Rádios (' + rs.length + ')'; out.appendChild(h2);
      var rg = document.createElement('div'); rg.className = 'rgrid'; rg.style.paddingTop = '0';
      for (i = 0; i < rs.length && i < 60; i++) rg.appendChild(radioTile(rs[i]));
      out.appendChild(rg);
    }
  }

  // ================= Ajustes =================
  function openSettings() {
    $('customUrl').value = LS.get('tv2.custom', '');
    $('updatedInfo').textContent = updated ? 'Canais e rádios verificados automaticamente todos os dias. Última verificação: ' + fmtDate(updated) + '.' : '';
    $('settings').classList.remove('hidden');
  }

  // ================= Cliques =================
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act],[data-k],[data-chip],[data-tab],[data-golive],[data-radio]') : null;
    if (!el) return;
    if (el.hasAttribute('data-k')) {
      var key = el.getAttribute('data-k'), pos = +el.getAttribute('data-p');
      if (!lists[key]) lists[key] = listFor(key);
      if (el.closest('#sheet')) closeSheet();
      if (tab !== 'live') { if (key !== 'search') { liveKey = key; LS.set('tv3.liveKey', key); } show('live'); }
      play(key, pos);
      return;
    }
    if (el.hasAttribute('data-radio')) {
      var r = RADIOS[+el.getAttribute('data-radio')];
      if (radioNow && radioNow.u === r.u) { if (audio.paused) { var pp = audio.play(); if (pp && pp.catch) pp.catch(function () {}); } else audio.pause(); }
      else playRadio(r);
      return;
    }
    if (el.hasAttribute('data-tab')) { show(el.getAttribute('data-tab')); return; }
    if (el.hasAttribute('data-golive')) { liveKey = el.getAttribute('data-golive'); LS.set('tv3.liveKey', liveKey); show('live'); return; }
    if (el.hasAttribute('data-chip')) {
      var ck = el.getAttribute('data-chip'), parent = el.parentNode.id;
      if (parent === 'sheetChips') openSheet(ck);
      else if (parent === 'radioChips') { radioKey = ck; renderRadios(); }
      else { liveKey = ck; LS.set('tv3.liveKey', ck); renderLive(); $('liveList').scrollTop = 0; }
      return;
    }
    switch (el.getAttribute('data-act')) {
      case 'prev': if (cur) play(cur.key, cur.pos - 1); break;
      case 'next': if (cur) play(cur.key, cur.pos + 1); break;
      case 'retry': if (cur) play(cur.key, cur.pos); break;
      case 'toggle':
        if (!current()) break;
        if (video.paused) { var p = video.play(); if (p && p.catch) p.catch(function () {}); } else video.pause();
        wake(); break;
      case 'fav': toggleFav(); break;
      case 'expand': expand(true); break;
      case 'shrink': expand(false); break;
      case 'native': if (video.webkitEnterFullscreen) { try { video.webkitEnterFullscreen(); } catch (er) {} } break;
      case 'pip':
        if (current() && video.webkitSetPresentationMode) {
          try { video.webkitSetPresentationMode(video.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture'); } catch (er2) {}
        }
        break;
      case 'openSheet': openSheet(); break;
      case 'closeSheet': closeSheet(); break;
      case 'radioToggle': if (audio.paused) { var ap = audio.play(); if (ap && ap.catch) ap.catch(function () {}); } else audio.pause(); break;
      case 'radioClose': stopRadio(false); break;
      case 'settings': openSettings(); break;
      case 'closeSettings': $('settings').classList.add('hidden'); break;
      case 'saveSettings':
        LS.set('tv2.custom', trim($('customUrl').value)); $('settings').classList.add('hidden');
        loadCustom(function () { numberChannels(); show(tab === 'search' ? 'home' : tab); }); break;
      case 'clearData':
        favs = []; recents = []; favData = {};
        LS.set('tv2.favs', favs); LS.set('tv2.recents', recents); LS.set('tv2.favData', favData);
        $('settings').classList.add('hidden'); show(tab); break;
    }
  });

  // ================= Relógio =================
  function tick() { var d = new Date(); $('clock').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  tick(); setInterval(tick, 15000);

  // ================= Dados =================
  function xhr(url, ok, fail) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true); x.timeout = 30000;
    x.onload = function () { if (x.status >= 200 && x.status < 300) ok(x.responseText); else fail(); };
    x.onerror = x.ontimeout = fail;
    x.send();
  }
  // Baixa e guarda no iPad; sem conexão, usa a última cópia guardada.
  function cached(url, key, ok) {
    xhr(url, function (t) { try { localStorage.setItem(key, t); } catch (e) {} ok(t); },
      function () { var t = null; try { t = localStorage.getItem(key); } catch (e) {} ok(t); });
  }
  function parseM3U(text) {
    var lines = text.split(/\r?\n/), out = [], c = null;
    for (var i = 0; i < lines.length; i++) {
      var l = trim(lines[i]);
      if (l.indexOf('#EXTINF') === 0) {
        var k = l.lastIndexOf('",'), m;
        c = { n: trim(k > -1 ? l.slice(k + 2) : l.slice(l.indexOf(',') + 1)) };
        if ((m = l.match(/tvg-logo="([^"]*)"/))) c.l = m[1];
        if ((m = l.match(/group-title="([^"]*)"/))) c.g = m[1];
      } else if (l && l.charAt(0) !== '#' && c) { c.u = l; out.push(c); c = null; }
    }
    return out;
  }
  function setCustom(items) {
    for (var i = CATS.length - 1; i >= 0; i--) if (CATS[i].id === 'custom') CATS.splice(i, 1);
    CH = CH.filter(function (c) { return !c.custom; });
    if (items && items.length) {
      for (var j = 0; j < items.length; j++) { items[j].custom = 1; CH.push(items[j]); byUrl[items[j].u] = items[j]; }
      CATS.unshift({ id: 'custom', name: 'Minha lista', items: items });
    }
    lists = {};
  }
  function loadCustom(done) {
    var u = LS.get('tv2.custom', '');
    if (!u) { setCustom(null); done(); return; }
    cached(u, 'tv2.customData', function (t) { setCustom(t ? parseM3U(t) : null); done(); });
  }
  function numberChannels() { for (var i = 0; i < CH.length; i++) CH[i].num = i + 1; }
  function useData(text) {
    var d = JSON.parse(text);
    updated = d.updated || '';
    CH = d.ch; byUrl = {}; CATS = [];
    for (var i = 0; i < CH.length; i++) { CH[i].g = groupPt(CH[i].g); byUrl[CH[i].u] = CH[i]; }
    for (var c = 0; c < d.cats.length; c++) {
      var items = [];
      for (var j = 0; j < d.cats[c].items.length; j++) items.push(CH[d.cats[c].items[j]]);
      CATS.push({ id: d.cats[c].id, name: d.cats[c].name, items: items });
    }
    lists = {};
  }
  function useRadios(text) {
    var d = JSON.parse(text);
    RADIOS = d.radios || []; RCATS = d.cats || [];
    for (var i = 0; i < RADIOS.length; i++) RADIOS[i].idx = i;
  }
  function start() {
    var hour = Math.floor(Date.now() / 3600000), pending = 2;
    function done() { if (--pending) return; loadCustom(function () { numberChannels(); show(LS.get('tv3.tab', 'home')); }); }
    cached('channels.json?v=' + hour, 'tv2.data', function (t) { if (t) { try { useData(t); } catch (e) {} } done(); });
    cached('radios.json?v=' + hour, 'tv3.radios', function (t) { if (t) { try { useRadios(t); } catch (e) {} } done(); });
  }

  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
  start();
})();
</script>
</body>
</html>
