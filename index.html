<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TV">
<meta name="theme-color" content="#0b0c0f">
<title>TV</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  :root {
    --bg: #0b0c0f; --surface: #16181d; --surface2: #1f2229; --line: #2a2d35;
    --text: #f2f2f4; --muted: #9ca0a8; --accent: #f2c14e; --accent-ink: #1a1405;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.35 -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  body.lock { overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  input { font: inherit; color: inherit; }
  .hidden { display: none !important; }
  svg { width: 24px; height: 24px; fill: currentColor; display: block; }

  /* ---------- Topo ---------- */
  .top { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center;
         padding: calc(10px + env(safe-area-inset-top)) 18px 10px;
         background: linear-gradient(rgba(11,12,15,.96), rgba(11,12,15,.75) 70%, rgba(11,12,15,0)); }
  .brand { display: flex; align-items: center; font-weight: 800; font-size: 22px; letter-spacing: .5px; flex: 1; }
  .brand i { display: inline-block; width: 30px; height: 30px; border-radius: 8px; background: url(icon.png) center/cover; margin-right: 10px; }
  .iconbtn { width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; margin-left: 4px; }
  .iconbtn:active { background: rgba(255,255,255,.12); }

  /* ---------- Destaque ---------- */
  #home { padding: calc(64px + env(safe-area-inset-top)) 0 40px; }
  .hero { margin: 8px 18px 22px; border-radius: 16px; overflow: hidden; position: relative; min-height: 220px;
          background: radial-gradient(120% 140% at 85% 20%, #3a2f12 0%, #1b1a17 45%, var(--surface) 100%); display: flex; align-items: flex-end; }
  .hero .logo { position: absolute; right: 28px; top: 50%; -webkit-transform: translateY(-50%); transform: translateY(-50%); width: 38%; max-width: 260px; height: 60%; background: center/contain no-repeat; opacity: .95; }
  .hero .info { position: relative; padding: 22px 24px; max-width: 60%; }
  .hero .kicker { font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--accent); font-weight: 700; }
  .hero h2 { margin: 6px 0 4px; font-size: 28px; line-height: 1.1; }
  .hero p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  .btn { display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 10px; font-weight: 700; }
  .btn svg { width: 20px; height: 20px; margin-right: 8px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: rgba(255,255,255,.12); margin-left: 8px; }
  .btn:active { opacity: .8; }

  /* ---------- Fileiras ---------- */
  .row { margin-bottom: 22px; }
  .row-head { display: flex; align-items: baseline; padding: 0 18px 8px; }
  .row-head h3 { margin: 0; font-size: 18px; flex: 1; }
  .row-head button { color: var(--muted); font-size: 14px; padding: 6px 0 6px 12px; }
  .strip { display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 0 12px 4px 18px; }
  .strip::-webkit-scrollbar { display: none; }
  .strip .card { flex: 0 0 150px; width: 150px; min-width: 0; margin-right: 12px; }

  .card { display: block; text-align: left; width: 100%; min-width: 0; overflow: hidden; }
  .tile { position: relative; height: 88px; border-radius: 10px; background: var(--surface); overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .card:active .tile { -webkit-transform: scale(.96); transform: scale(.96); }
  .card.now .tile { box-shadow: 0 0 0 2px var(--accent) inset; }
  .tile img { max-width: 76%; max-height: 66%; opacity: 0; -webkit-transition: opacity .2s; transition: opacity .2s; }
  .tile img.ok { opacity: 1; }
  .tile .ini { position: absolute; font-weight: 800; font-size: 26px; color: #4a4e58; }
  .tile .ini.gone { display: none; }
  .tile .q { position: absolute; right: 6px; bottom: 6px; font-size: 10px; font-weight: 700; background: rgba(0,0,0,.6); color: #ddd; padding: 1px 5px; border-radius: 4px; }
  .tile .star { position: absolute; left: 7px; top: 5px; color: var(--accent); font-size: 13px; }
  .card .name { margin-top: 6px; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .empty { padding: 60px 24px; text-align: center; color: var(--muted); }
  .foot { padding: 6px 18px 30px; font-size: 12px; color: #6b6f78; }

  /* ---------- Chips ---------- */
  .chips { display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 0 18px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; height: 36px; padding: 0 16px; margin-right: 8px; border-radius: 18px; background: var(--surface2); color: var(--muted); font-size: 14px; font-weight: 600; white-space: nowrap; }
  .chip.on { background: var(--text); color: var(--bg); }

  /* ---------- Explorar (tela cheia) ---------- */
  .layer { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column; }
  .layer-head { display: flex; align-items: center; padding: calc(8px + env(safe-area-inset-top)) 10px 8px; }
  .layer-head h3 { margin: 0 0 0 4px; font-size: 20px; flex: 1; }
  .search { display: flex; align-items: center; background: var(--surface2); border-radius: 10px; margin: 0 18px 12px; padding: 0 12px; height: 42px; }
  .search svg { width: 20px; height: 20px; color: var(--muted); margin-right: 8px; }
  .search input { flex: 1; background: none; border: 0; outline: 0; height: 40px; -webkit-appearance: none; min-width: 0; }
  .grid-wrap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 18px 40px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); grid-gap: 16px 12px; }
  .count { font-size: 13px; color: var(--muted); margin-bottom: 10px; }

  /* ---------- Player ---------- */
  #player { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 30; }
  #video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; }
  #tap { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  .ui { -webkit-transition: opacity .25s; transition: opacity .25s; }
  #player.idle .ui { opacity: 0; pointer-events: none; }
  .p-top { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; padding: calc(10px + env(safe-area-inset-top)) 12px 30px;
           background: linear-gradient(rgba(0,0,0,.8), rgba(0,0,0,0)); }
  .p-title { flex: 1; min-width: 0; margin-left: 6px; }
  .p-title b { display: block; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-title span { font-size: 12px; color: #c9ccd2; }
  .live { display: inline-block; background: #e53935; color: #fff; font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 3px; margin-right: 6px; letter-spacing: .5px; vertical-align: 1px; }
  .p-mid { position: absolute; top: 50%; left: 50%; -webkit-transform: translate(-50%, -50%); transform: translate(-50%, -50%); display: flex; align-items: center; }
  .round { width: 56px; height: 56px; border-radius: 28px; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; margin: 0 18px; }
  .round.big { width: 76px; height: 76px; border-radius: 38px; }
  .round.big svg { width: 38px; height: 38px; }
  .round:active { background: rgba(255,255,255,.2); }
  .p-bot { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: flex-end; padding: 30px 14px calc(14px + env(safe-area-inset-bottom));
           background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.8)); }
  .pill { display: inline-flex; align-items: center; height: 42px; padding: 0 16px; border-radius: 21px; background: rgba(255,255,255,.16); font-weight: 700; font-size: 15px; margin-left: 8px; }
  .pill svg { width: 20px; height: 20px; margin-right: 6px; }
  .pill.accent { background: var(--accent); color: var(--accent-ink); }
  .pill:active { opacity: .75; }
  .star-on { color: var(--accent); }

  #msg { position: absolute; top: calc(50% + 60px); left: 50%; -webkit-transform: translateX(-50%); transform: translateX(-50%); text-align: center; width: 80%; max-width: 420px; }
  #msg p { margin: 14px 0 16px; color: #ddd; }
  .spin { width: 44px; height: 44px; margin: 0 auto; border-radius: 22px; border: 4px solid rgba(255,255,255,.2); border-top-color: var(--accent); -webkit-animation: sp 0.9s linear infinite; animation: sp 0.9s linear infinite; }
  @-webkit-keyframes sp { to { -webkit-transform: rotate(360deg); } }
  @keyframes sp { to { transform: rotate(360deg); } }
  #msg.err .spin { display: none; }

  /* Gaveta de canais por cima do vídeo */
  #sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; padding: 14px 0 calc(16px + env(safe-area-inset-bottom));
           background: rgba(14,15,19,.94); -webkit-backdrop-filter: blur(18px); border-radius: 18px 18px 0 0;
           -webkit-transform: translateY(105%); transform: translateY(105%); -webkit-transition: -webkit-transform .28s ease; transition: transform .28s ease; }
  #sheet.open { -webkit-transform: none; transform: none; }
  #player.sheet .p-bot, #player.sheet .p-mid, #player.sheet #msg { opacity: 0; pointer-events: none; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: #555; margin: -4px auto 10px; }
  .sheet-head { display: flex; align-items: center; padding: 0 10px 10px 18px; }
  .sheet-head b { flex: 1; font-size: 17px; }
  #sheet .chips { margin-bottom: 12px; }
  #sheet .strip .card { flex-basis: 136px; width: 136px; }

  /* Ajustes */
  .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 40; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .box { background: var(--surface); border-radius: 16px; width: 100%; max-width: 480px; padding: 20px; }
  .box h3 { margin: 0 0 4px; }
  .box p { color: var(--muted); font-size: 13px; margin: 4px 0 14px; }
  .box label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  .box input { width: 100%; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; -webkit-appearance: none; }
  .box .actions { display: flex; justify-content: flex-end; margin-top: 18px; }
  .box .btn { height: 40px; padding: 0 16px; font-size: 15px; }
  .linkish { color: var(--danger); font-size: 14px; margin-top: 14px; }
</style>
</head>
<body>

<!-- ===== Início ===== -->
<div class="top">
  <div class="brand"><i></i>TV</div>
  <button class="iconbtn" data-act="search" aria-label="Buscar"><svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 015.6 11.2l4.6 4.6-1.4 1.4-4.6-4.6A7 7 0 1110 3zm0 2a5 5 0 100 10 5 5 0 000-10z"/></svg></button>
  <button class="iconbtn" data-act="settings" aria-label="Ajustes"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 110 7 3.5 3.5 0 010-7zm8.4 2.3l-1.9-.4a6.9 6.9 0 00-.7-1.6l1-1.6-1.9-1.9-1.6 1a6.9 6.9 0 00-1.6-.7L13.3 3h-2.6l-.4 1.9a6.9 6.9 0 00-1.6.7l-1.6-1-1.9 1.9 1 1.6a6.9 6.9 0 00-.7 1.6L3.6 11v2.6l1.9.4c.2.6.4 1.1.7 1.6l-1 1.6 1.9 1.9 1.6-1c.5.3 1 .5 1.6.7l.4 1.9h2.6l.4-1.9c.6-.2 1.1-.4 1.6-.7l1.6 1 1.9-1.9-1-1.6c.3-.5.5-1 .7-1.6l1.9-.4V11z"/></svg></button>
</div>
<main id="home"><div class="empty">Carregando canais…</div></main>

<!-- ===== Explorar ===== -->
<section id="browse" class="layer hidden">
  <div class="layer-head">
    <button class="iconbtn" data-act="closeBrowse" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="M15.4 5.4L14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg></button>
    <h3 id="browseTitle">Explorar</h3>
  </div>
  <div class="search"><svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 015.6 11.2l4.6 4.6-1.4 1.4-4.6-4.6A7 7 0 1110 3zm0 2a5 5 0 100 10 5 5 0 000-10z"/></svg>
    <input id="q" type="search" placeholder="Buscar canal, categoria…" autocomplete="off" autocorrect="off" autocapitalize="off"></div>
  <div class="chips" id="browseChips"></div>
  <div class="grid-wrap" id="gridWrap"><div class="count" id="count"></div><div class="grid" id="grid"></div><div id="sentinel" style="height:1px"></div></div>
</section>

<!-- ===== Player ===== -->
<section id="player" class="hidden">
  <video id="video" playsinline webkit-playsinline preload="none"></video>
  <div id="tap"></div>
  <div id="msg" class="hidden"><div class="spin"></div><p id="msgText"></p><div id="msgActions"></div></div>

  <div class="ui p-top">
    <button class="iconbtn" data-act="closePlayer" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="M15.4 5.4L14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg></button>
    <div class="p-title"><b id="pName"></b><span><i class="live">AO VIVO</i><span id="pSub"></span></span></div>
    <button class="iconbtn" data-act="fav" id="favBtn" aria-label="Favorito"><svg viewBox="0 0 24 24"><path id="favPath" d="M12 17.3l-6.2 3.7 1.6-7L2 9.2l7.1-.6L12 2l2.9 6.6 7.1.6-5.4 4.8 1.6 7z"/></svg></button>
  </div>
  <div class="ui p-mid">
    <button class="round" data-act="prev" aria-label="Canal anterior"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 18V6z"/></svg></button>
    <button class="round big" data-act="toggle" aria-label="Pausar"><svg viewBox="0 0 24 24" id="ppIcon"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg></button>
    <button class="round" data-act="next" aria-label="Próximo canal"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
  </div>
  <div class="ui p-bot">
    <button class="pill" data-act="fullscreen"><svg viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5zm9 0h5v5h-2V7h-3zM5 14h2v3h3v2H5zm12 0h2v5h-5v-2h3z"/></svg>Tela cheia</button>
    <button class="pill accent" data-act="openSheet"><svg viewBox="0 0 24 24"><path d="M3 5h18v2H3zm0 6h18v2H3zm0 6h18v2H3z"/></svg>Canais</button>
  </div>

  <div id="sheet">
    <div class="grab"></div>
    <div class="sheet-head"><b>Canais</b>
      <button class="iconbtn" data-act="closeSheet" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M18.3 7.1L16.9 5.7 12 10.6 7.1 5.7 5.7 7.1l4.9 4.9-4.9 4.9 1.4 1.4 4.9-4.9 4.9 4.9 1.4-1.4-4.9-4.9z"/></svg></button></div>
    <div class="chips" id="sheetChips"></div>
    <div class="strip" id="sheetStrip"></div>
  </div>
</section>

<!-- ===== Ajustes ===== -->
<div id="settings" class="modal hidden">
  <div class="box">
    <h3>Ajustes</h3>
    <p id="updatedInfo"></p>
    <label for="customUrl">Minha lista (.m3u)</label>
    <input id="customUrl" type="url" placeholder="https://…/lista.m3u" autocapitalize="off" autocorrect="off">
    <p>Opcional. Fica salva só neste iPad e aparece como a fileira “Minha lista”.</p>
    <button class="linkish" data-act="clearData">Apagar favoritos e histórico</button>
    <div class="actions">
      <button class="btn ghost" data-act="closeSettings">Cancelar</button>
      <button class="btn primary" data-act="saveSettings">Salvar</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // ---------- Estado ----------
  var CH = [];             // todos os canais (objetos)
  var CATS = [];           // {id, name, items: [canal]}
  var byUrl = {};
  var favs = LS.get('tv2.favs', []);       // urls
  var recents = LS.get('tv2.recents', []); // urls
  var favData = LS.get('tv2.favData', {}); // url -> canal (para sobreviver a mudanças na lista)
  var lists = {};          // chave -> array de canais (para navegação anterior/próximo)
  var cur = null;          // {key, pos}
  var updated = '';

  var GROUPS = { General: 'Geral', Entertainment: 'Entretenimento', Movies: 'Filmes', Music: 'Música', News: 'Notícias',
    Religious: 'Religioso', Kids: 'Infantil', Series: 'Séries', Sports: 'Esportes', Documentary: 'Documentários',
    Shop: 'Compras', Culture: 'Cultura', Education: 'Educação', Lifestyle: 'Estilo de vida', Comedy: 'Comédia',
    Animation: 'Animação', Business: 'Negócios', Classic: 'Clássicos', Family: 'Família', Legislative: 'Legislativo',
    Outdoor: 'Natureza', Science: 'Ciência', Travel: 'Viagem', Weather: 'Clima', Cooking: 'Culinária', Auto: 'Automóveis',
    Relax: 'Relax', Public: 'Pública', Interactive: 'Interativo', Undefined: '' };
  function groupPt(g) {
    if (!g) return '';
    var parts = g.split(/\s*[·;]\s*/), out = [];
    for (var i = 0; i < parts.length; i++) { var t = GROUPS.hasOwnProperty(parts[i]) ? GROUPS[parts[i]] : parts[i]; if (t && out.indexOf(t) < 0) out.push(t); }
    return out.slice(0, 2).join(' · ');
  }
  function initials(n) { var m = n.replace(/[^A-Za-z0-9À-ÿ ]/g, '').split(' '); return ((m[0] || '').charAt(0) + (m[1] || '').charAt(0)).toUpperCase() || 'TV'; }
  function isFav(u) { return favs.indexOf(u) > -1; }
  function favList() { var out = []; for (var i = 0; i < favs.length; i++) { var c = byUrl[favs[i]] || favData[favs[i]]; if (c) out.push(c); } return out; }
  function recentList() { var out = []; for (var i = 0; i < recents.length; i++) { var c = byUrl[recents[i]] || favData[recents[i]]; if (c) out.push(c); } return out; }
  function listFor(key) {
    if (key === 'fav') return favList();
    if (key === 'recent') return recentList();
    if (key === 'search') return lists.search || [];
    for (var i = 0; i < CATS.length; i++) if (CATS[i].id === key) return CATS[i].items;
    return [];
  }
  function catName(key) {
    if (key === 'fav') return 'Favoritos';
    if (key === 'recent') return 'Assistidos recentemente';
    if (key === 'search') return 'Busca';
    for (var i = 0; i < CATS.length; i++) if (CATS[i].id === key) return CATS[i].name;
    return '';
  }

  // ---------- Imagens sob demanda ----------
  var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function (es) {
    for (var i = 0; i < es.length; i++) if (es[i].isIntersecting) { loadImg(es[i].target); io.unobserve(es[i].target); }
  }, { rootMargin: '200px' }) : null;
  function loadImg(img) {
    img.onload = function () { img.className = 'ok'; if (img.previousSibling) img.previousSibling.className = 'ini gone'; };
    img.onerror = function () { img.parentNode && img.parentNode.removeChild(img); };
    img.src = img.getAttribute('data-src');
  }

  function card(c, key, pos) {
    var b = document.createElement('button');
    b.className = 'card' + (cur && lists[cur.key] && lists[cur.key][cur.pos] === c ? ' now' : '');
    b.setAttribute('data-k', key); b.setAttribute('data-p', pos);
    var t = document.createElement('div'); t.className = 'tile';
    var ini = document.createElement('span'); ini.className = 'ini'; ini.textContent = initials(c.n); t.appendChild(ini);
    if (c.l) {
      var img = document.createElement('img'); img.alt = ''; img.setAttribute('data-src', c.l); t.appendChild(img);
      if (io) io.observe(img); else loadImg(img);
    }
    if (c.q) { var q = document.createElement('span'); q.className = 'q'; q.textContent = c.q; t.appendChild(q); }
    if (isFav(c.u)) { var s = document.createElement('span'); s.className = 'star'; s.textContent = '★'; t.appendChild(s); }
    var n = document.createElement('div'); n.className = 'name'; n.textContent = c.n;
    var g = document.createElement('div'); g.className = 'sub'; g.textContent = c.g || (c.pt ? 'Português' : '');
    b.appendChild(t); b.appendChild(n); b.appendChild(g);
    return b;
  }

  // ---------- Início ----------
  var ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';
  function renderHome() {
    var home = $('home'); home.innerHTML = '';
    if (!CATS.length) { home.innerHTML = '<div class="empty">Não foi possível carregar os canais. Verifique a internet e abra de novo.</div>'; return; }
    var rec = recentList();
    var hero = rec[0] || (CATS[0].items[0]);
    var heroKey = rec[0] ? 'recent' : CATS[0].id;
    lists[heroKey] = listFor(heroKey);
    var h = document.createElement('div'); h.className = 'hero';
    h.innerHTML = '<div class="logo"></div><div class="info"><div class="kicker"></div><h2></h2><p></p>' +
      '<button class="btn primary" data-k="' + heroKey + '" data-p="0">' + ICON_PLAY + 'Assistir</button>' +
      '<button class="btn ghost" data-act="search">Explorar</button></div>';
    h.querySelector('.kicker').textContent = rec[0] ? 'Continuar assistindo' : 'Em destaque';
    h.querySelector('h2').textContent = hero.n;
    h.querySelector('p').textContent = hero.g || catName(heroKey);
    if (hero.l) h.querySelector('.logo').style.backgroundImage = 'url("' + hero.l + '")';
    home.appendChild(h);

    var rows = [];
    if (favs.length) rows.push('fav');
    if (rec.length) rows.push('recent');
    for (var i = 0; i < CATS.length; i++) rows.push(CATS[i].id);
    for (var r = 0; r < rows.length; r++) {
      var key = rows[r], items = listFor(key);
      if (!items.length) continue;
      lists[key] = items;
      var row = document.createElement('section'); row.className = 'row';
      var head = document.createElement('div'); head.className = 'row-head';
      var t = document.createElement('h3'); t.textContent = catName(key); head.appendChild(t);
      if (items.length > 12) { var more = document.createElement('button'); more.textContent = 'Ver tudo (' + items.length + ') ›'; more.setAttribute('data-browse', key); head.appendChild(more); }
      var strip = document.createElement('div'); strip.className = 'strip';
      var max = Math.min(items.length, 16);
      for (var j = 0; j < max; j++) strip.appendChild(card(items[j], key, j));
      row.appendChild(head); row.appendChild(strip); home.appendChild(row);
    }
    var foot = document.createElement('div'); foot.className = 'foot';
    foot.textContent = CH.length + ' canais testados e funcionando' + (updated ? ' · lista atualizada em ' + fmtDate(updated) : '') + '. Canais públicos e gratuitos (iptv-org).';
    home.appendChild(foot);
  }
  function fmtDate(iso) { var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('pt-BR') + ' ' + ('0' + d.getHours()).slice(-2) + 'h'; }

  // ---------- Explorar ----------
  var bKey = 'pt', bItems = [], bShown = 0, PAGE = 48;
  function chipsHtml(el, active, onlyNonEmpty) {
    el.innerHTML = '';
    var keys = [];
    if (favs.length) keys.push('fav');
    if (recents.length) keys.push('recent');
    for (var i = 0; i < CATS.length; i++) keys.push(CATS[i].id);
    for (var k = 0; k < keys.length; k++) {
      var b = document.createElement('button'); b.className = 'chip' + (keys[k] === active ? ' on' : '');
      b.textContent = keys[k] === 'recent' ? 'Recentes' : catName(keys[k]); b.setAttribute('data-chip', keys[k]);
      el.appendChild(b);
    }
  }
  function openBrowse(key, focusSearch) {
    bKey = key || bKey; $('q').value = '';
    $('browse').classList.remove('hidden'); document.body.classList.add('lock');
    fillBrowse();
    if (focusSearch) setTimeout(function () { $('q').focus(); }, 50);
  }
  function fillBrowse() {
    var term = $('q').value.toLowerCase().replace(/^\s+|\s+$/g, '');
    chipsHtml($('browseChips'), term ? '' : bKey);
    if (term) {
      var seen = {}, out = [];
      for (var i = 0; i < CH.length; i++) {
        var c = CH[i];
        if (!seen[c.u] && (c.n + ' ' + (c.g || '')).toLowerCase().indexOf(term) > -1) { out.push(c); seen[c.u] = 1; }
      }
      lists.search = out; bItems = out;
      $('browseTitle').textContent = 'Busca';
    } else {
      bItems = listFor(bKey); lists[bKey] = bItems;
      $('browseTitle').textContent = catName(bKey);
    }
    $('grid').innerHTML = ''; bShown = 0;
    $('count').textContent = bItems.length + (bItems.length === 1 ? ' canal' : ' canais');
    $('gridWrap').scrollTop = 0;
    moreBrowse();
  }
  function moreBrowse() {
    var key = $('q').value ? 'search' : bKey;
    var frag = document.createDocumentFragment(), end = Math.min(bShown + PAGE, bItems.length);
    for (var i = bShown; i < end; i++) frag.appendChild(card(bItems[i], key, i));
    $('grid').appendChild(frag); bShown = end;
  }
  $('gridWrap').addEventListener('scroll', function () {
    var w = $('gridWrap');
    if (bShown < bItems.length && w.scrollTop + w.clientHeight > w.scrollHeight - 400) moreBrowse();
  });
  var qTimer;
  $('q').addEventListener('input', function () { clearTimeout(qTimer); qTimer = setTimeout(fillBrowse, 250); });
  function closeBrowse() { $('browse').classList.add('hidden'); document.body.classList.remove('lock'); $('q').blur(); }

  // ---------- Player ----------
  var video = $('video'), player = $('player'), idleTimer, watchdog, sheetKey = null;
  function showMsg(text, isErr, actions) {
    $('msg').classList.remove('hidden');
    $('msg').className = isErr ? 'err' : '';
    $('msgText').textContent = text;
    $('msgActions').innerHTML = actions || '';
  }
  function hideMsg() { $('msg').className = 'hidden'; }

  function play(key, pos) {
    var list = lists[key] || listFor(key);
    if (!list.length) return;
    lists[key] = list;
    pos = (pos + list.length) % list.length;
    cur = { key: key, pos: pos };
    var c = list[pos];
    player.classList.remove('hidden'); document.body.classList.add('lock');
    $('pName').textContent = c.n;
    $('pSub').textContent = (c.g || catName(key)) + (c.q ? ' · ' + c.q : '');
    setFavIcon();
    showMsg('Sintonizando…', false);
    clearTimeout(watchdog);
    watchdog = setTimeout(function () { if (video.paused || video.readyState < 2) failed(); }, 15000);
    video.src = c.u;
    video.load();
    var p = video.play(); if (p && p.catch) p.catch(function () {});
    addRecent(c);
    wake();
  }
  function failed() {
    clearTimeout(watchdog);
    if (player.classList.contains('hidden')) return;
    showMsg('Este canal não está respondendo agora.', true,
      '<button class="pill accent" data-act="next">Próximo canal</button><button class="pill" data-act="retry">Tentar de novo</button>');
    wake(true);
  }
  video.addEventListener('playing', function () { clearTimeout(watchdog); hideMsg(); setPP(); wake(); });
  video.addEventListener('waiting', function () { if (!video.paused) showMsg('Carregando…', false); });
  video.addEventListener('pause', setPP);
  video.addEventListener('error', function () { if (video.getAttribute('src')) failed(); });

  function setPP() {
    $('ppIcon').innerHTML = video.paused ? '<path d="M7 4v16l13-8z"/>' : '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  }
  function stop() {
    clearTimeout(watchdog); clearTimeout(idleTimer);
    video.pause(); video.removeAttribute('src'); video.load();
    player.classList.add('hidden'); closeSheet(); hideMsg();
    if ($('browse').classList.contains('hidden')) document.body.classList.remove('lock');
    renderHome();
    if (!$('browse').classList.contains('hidden')) fillBrowse();
  }
  // Controles somem sozinhos durante a reprodução; um toque traz de volta.
  function wake(stay) {
    player.classList.remove('idle');
    clearTimeout(idleTimer);
    if (!stay) idleTimer = setTimeout(function () {
      if (!video.paused && !$('sheet').classList.contains('open')) player.classList.add('idle');
    }, 4000);
  }
  $('tap').addEventListener('click', function () {
    if ($('sheet').classList.contains('open')) { closeSheet(); return; }
    if (player.classList.contains('idle')) wake(); else if (!video.paused) { clearTimeout(idleTimer); player.classList.add('idle'); }
  });

  function addRecent(c) {
    var i = recents.indexOf(c.u); if (i > -1) recents.splice(i, 1);
    recents.unshift(c.u); if (recents.length > 15) recents.length = 15;
    favData[c.u] = c;
    LS.set('tv2.recents', recents); saveFavData();
  }
  function saveFavData() {
    var keep = {}, all = favs.concat(recents);
    for (var i = 0; i < all.length; i++) if (favData[all[i]]) keep[all[i]] = favData[all[i]];
    favData = keep; LS.set('tv2.favData', favData);
  }
  function current() { return cur && lists[cur.key] ? lists[cur.key][cur.pos] : null; }
  function setFavIcon() { var c = current(); $('favBtn').className = 'iconbtn' + (c && isFav(c.u) ? ' star-on' : ''); }
  function toggleFav() {
    var c = current(); if (!c) return;
    var i = favs.indexOf(c.u);
    if (i > -1) favs.splice(i, 1); else { favs.unshift(c.u); favData[c.u] = c; }
    LS.set('tv2.favs', favs); saveFavData(); setFavIcon(); wake();
  }

  // Gaveta de canais
  function openSheet(key) {
    sheetKey = key || sheetKey || (cur ? cur.key : 'pt');
    chipsHtml($('sheetChips'), sheetKey);
    var strip = $('sheetStrip'); strip.innerHTML = '';
    var items = listFor(sheetKey); lists[sheetKey] = items;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < items.length && i < 150; i++) frag.appendChild(card(items[i], sheetKey, i));
    strip.appendChild(frag);
    $('sheet').classList.add('open'); player.classList.add('sheet'); wake(true);
    if (cur && cur.key === sheetKey && strip.children[cur.pos]) strip.scrollLeft = Math.max(0, strip.children[cur.pos].offsetLeft - 18);
  }
  function closeSheet() { $('sheet').classList.remove('open'); player.classList.remove('sheet'); if (!player.classList.contains('hidden')) wake(); }

  // ---------- Ajustes ----------
  function openSettings() {
    $('customUrl').value = LS.get('tv2.custom', '');
    $('updatedInfo').textContent = updated ? 'Canais verificados automaticamente todos os dias. Última verificação: ' + fmtDate(updated) + '.' : '';
    $('settings').classList.remove('hidden');
  }
  function saveSettings() {
    var u = $('customUrl').value.replace(/^\s+|\s+$/g, '');
    LS.set('tv2.custom', u);
    $('settings').classList.add('hidden');
    loadCustom(function () { renderHome(); });
  }

  // ---------- Cliques (delegação) ----------
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act],[data-k],[data-chip],[data-browse]') : null;
    if (!el) return;
    if (el.hasAttribute('data-k')) {
      var key = el.getAttribute('data-k'), pos = +el.getAttribute('data-p');
      if (!lists[key]) lists[key] = listFor(key);
      if ($('sheet').classList.contains('open')) closeSheet();
      play(key, pos);
      return;
    }
    if (el.hasAttribute('data-chip')) {
      var ck = el.getAttribute('data-chip');
      if (el.parentNode.id === 'sheetChips') openSheet(ck); else { $('q').value = ''; bKey = ck; fillBrowse(); }
      return;
    }
    if (el.hasAttribute('data-browse')) { openBrowse(el.getAttribute('data-browse')); return; }
    switch (el.getAttribute('data-act')) {
      case 'search': openBrowse('pt', true); break;
      case 'closeBrowse': closeBrowse(); break;
      case 'closePlayer': stop(); break;
      case 'prev': if (cur) play(cur.key, cur.pos - 1); break;
      case 'next': if (cur) play(cur.key, cur.pos + 1); break;
      case 'retry': if (cur) play(cur.key, cur.pos); break;
      case 'toggle': if (video.paused) { var p = video.play(); if (p && p.catch) p.catch(function () {}); } else video.pause(); wake(); break;
      case 'fav': toggleFav(); break;
      case 'fullscreen':
        if (video.webkitEnterFullscreen) { try { video.webkitEnterFullscreen(); } catch (er) {} }
        else if (player.webkitRequestFullscreen) player.webkitRequestFullscreen();
        break;
      case 'openSheet': openSheet(); break;
      case 'closeSheet': closeSheet(); break;
      case 'settings': openSettings(); break;
      case 'closeSettings': $('settings').classList.add('hidden'); break;
      case 'saveSettings': saveSettings(); break;
      case 'clearData':
        favs = []; recents = []; favData = {};
        LS.set('tv2.favs', favs); LS.set('tv2.recents', recents); LS.set('tv2.favData', favData);
        $('settings').classList.add('hidden'); renderHome(); break;
    }
  });

  // ---------- Dados ----------
  function xhr(url, ok, fail) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true); x.timeout = 30000;
    x.onload = function () { if (x.status >= 200 && x.status < 300) ok(x.responseText); else fail(); };
    x.onerror = x.ontimeout = fail;
    x.send();
  }
  function parseM3U(text) {
    var lines = text.split(/\r?\n/), out = [], c = null;
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i].replace(/^\s+|\s+$/g, '');
      if (l.indexOf('#EXTINF') === 0) {
        var k = l.lastIndexOf('",'), m;
        c = { n: (k > -1 ? l.slice(k + 2) : l.slice(l.indexOf(',') + 1)).replace(/^\s+|\s+$/g, '') };
        if ((m = l.match(/tvg-logo="([^"]*)"/))) c.l = m[1];
        if ((m = l.match(/group-title="([^"]*)"/))) c.g = m[1];
      } else if (l && l.charAt(0) !== '#' && c) { c.u = l; out.push(c); c = null; }
    }
    return out;
  }
  function setCustom(items) {
    for (var i = CATS.length - 1; i >= 0; i--) if (CATS[i].id === 'custom') CATS.splice(i, 1);
    if (items && items.length) { CATS.unshift({ id: 'custom', name: 'Minha lista', items: items }); for (var j = 0; j < items.length; j++) { CH.push(items[j]); byUrl[items[j].u] = items[j]; } }
    delete lists.custom;
  }
  function loadCustom(done) {
    var u = LS.get('tv2.custom', '');
    if (!u) { setCustom(null); done(); return; }
    xhr(u, function (t) { try { localStorage.setItem('tv2.customData', t); } catch (e) {} setCustom(parseM3U(t)); done(); },
      function () { var t = null; try { t = localStorage.getItem('tv2.customData'); } catch (e) {} setCustom(t ? parseM3U(t) : null); done(); });
  }
  function useData(text) {
    var d = JSON.parse(text);
    updated = d.updated || '';
    CH = d.ch; byUrl = {};
    for (var i = 0; i < CH.length; i++) { CH[i].g = groupPt(CH[i].g); byUrl[CH[i].u] = CH[i]; }
    CATS = [];
    for (var c = 0; c < d.cats.length; c++) {
      var items = [];
      for (var j = 0; j < d.cats[c].items.length; j++) items.push(CH[d.cats[c].items[j]]);
      CATS.push({ id: d.cats[c].id, name: d.cats[c].name, items: items });
    }
    lists = {};
  }
  function start() {
    xhr('channels.json?v=' + Math.floor(Date.now() / 3600000), function (t) {
      try { useData(t); localStorage.setItem('tv2.data', t); } catch (e) {}
      loadCustom(renderHome);
    }, function () {
      var t = null; try { t = localStorage.getItem('tv2.data'); } catch (e) {}
      if (t) { try { useData(t); } catch (e) {} }
      loadCustom(renderHome);
    });
  }

  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
  start();
})();
</script>
</body>
</html>
